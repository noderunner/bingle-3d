# How this client draws draughts (Bingle's ADR 0124: the server says what things are, and each
# client decides how they look). Data only: nothing here changes the rules.
#
# Wooden checkers, stained red and black, made by the asset pipeline
# (`assets-src/blender/checkers.py`). A king is two, one on the other.

games = ["draughts"]

[pieces.man]
model = "models/checkers/man.glb"

[pieces.king]
model = "models/checkers/king.glb"

[seats.black]
pieces = "black"
paint = [0.14, 0.12, 0.12]

[seats.red]
pieces = "red"
paint = [0.62, 0.14, 0.11]

# Stained wood with a satin finish: the grain shows through the stain.
[materials.black]
wood = "walnut"
tint = [0.26, 0.24, 0.25]
clearcoat = 0.35
clearcoat_roughness = 0.22

[materials.red]
wood = "maple"
tint = [0.66, 0.13, 0.10]
clearcoat = 0.35
clearcoat_roughness = 0.22
