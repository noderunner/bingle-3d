# How this client draws Hex (Bingle's ADR 0124: the server says what things are, and each client
# decides how they look). Data only: nothing here changes the rules, and a game with no file like
# this one is drawn by the generic defaults in `src/look.rs`.
#
# Slate and shell stones on a wooden board, each side's edges (the board's rim and the cells along
# them) coloured to match its stones, and each side's stones in a turned bowl beside the board.

# The games this file is for, by the id the server gives them.
games = ["hex-7", "hex-9", "hex-11", "hex-13"]

# Each piece, by the id the game gives it: the model it is drawn as.
[pieces.stone]
model = "models/stone.glb"

# Each seat, by its colour word, which is a name and not a colour: what its pieces are made of,
# what the board's rim along the edges it must connect is made of, and its colour, in the panels
# and shading the cells along those edges.
[seats.red]
pieces = "slate"
goal = "ebony"
colour = [0.13, 0.13, 0.14]

[seats.blue]
pieces = "shell"
goal = "maple"
colour = [0.92, 0.91, 0.87]

# Materials (`look::MaterialSpec`). `albedo` is a texture, or `wood` one of the woods in
# `src/look.rs` (`board`: the board's own); `tint` (sRGB) multiplies its colour, as a stain does.
# Polish is a clear coat over the material.
[materials.slate]
albedo = "textures/stone/slate_albedo.jpg"
roughness = 0.45
reflectance = 0.3
# Oiled rather than lacquered: a soft sheen.
clearcoat = 0.3
clearcoat_roughness = 0.14

[materials.shell]
albedo = "textures/stone/shell_albedo.jpg"
roughness = 0.25
clearcoat = 0.6
clearcoat_roughness = 0.08
# Shell is not quite opaque: light comes through its edge.
translucency = 0.2

# The board's own wood, stained near black.
[materials.ebony]
wood = "board"
tint = [0.14, 0.11, 0.09]
# Satin: the rim faces the room's window, and gloss there would show the window, not the wood.
clearcoat = 0.2
clearcoat_roughness = 0.4

[materials.maple]
wood = "maple"
clearcoat = 0.2
clearcoat_roughness = 0.4

# A bowl of each side's stones beside the board, as Go's.
[bowls]
model = "models/bowl.glb"
stones = "models/bowl_stones.glb"
material = "bowl"

[materials.bowl]
wood = "cherry"
tint = [0.50, 0.40, 0.36]
clearcoat = 0.2
clearcoat_roughness = 0.35
