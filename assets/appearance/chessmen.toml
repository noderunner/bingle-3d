# How this client draws the games played with chessmen, or with a few of them (Bingle's ADR 0124:
# the server says what things are, and each client decides how they look). Data only: nothing
# here changes the rules.
#
# Turned chessmen of pale and of dark wood, made by the asset pipeline
# (`assets-src/blender/chessmen.py`).

# The games this file is for, by the id the server gives them.
games = ["breakthrough", "brandubh"]

# Each piece, by the id its game gives it: the model it is drawn as, and how it stands (`upright`:
# turned any way, never leaning; `forward`: looking across the board from its seat's side).
[pieces.pawn]
model = "models/chess/pawn.glb"
stands = "upright"

[pieces.attacker]
model = "models/chess/pawn.glb"
stands = "upright"

[pieces.defender]
model = "models/chess/pawn.glb"
stands = "upright"

[pieces.king]
model = "models/chess/king.glb"
stands = "forward"

# Each seat, by its color: what its pieces are made of, and its paint in the panels.
[seats.white]
pieces = "boxwood"
paint = [0.90, 0.80, 0.62]

[seats.black]
pieces = "ebonised"
paint = [0.13, 0.11, 0.10]

# Pale wood, polished.
[materials.boxwood]
wood = "maple"
tint = [1.0, 0.93, 0.78]
clearcoat = 0.5
clearcoat_roughness = 0.15

# Dark wood stained near black, polished.
[materials.ebonised]
wood = "walnut"
tint = [0.30, 0.26, 0.25]
clearcoat = 0.5
clearcoat_roughness = 0.15
