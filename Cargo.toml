[package]
name = "bingle-3d"
version = "0.0.2"
edition = "2024"
rust-version = "1.97.1"
description = "A 3D client for the Bingle game server, built with Bevy"
repository = "https://github.com/noderunner/bingle-3d"
license = "MIT"
publish = false

[dependencies]
# Pinned to one Bevy minor version: each release breaks APIs, so upgrades are deliberate (docs/plan.md).
# JPEG for the scanned textures (`assets-src/`): a tenth the size of lossless ones.
bevy = { version = "0.20.1", features = ["jpeg"] }
# Bytes and BytesMut are what rtc's packets are made of.
bytes = "1"
# Audio devices for voice chat. Bevy's audio already builds it (through rodio).
cpal = "0.17.3"
ring = "0.17.14"
# WebRTC for voice chat, sans I/O (its socket is ours), on ring like the rest.
rtc = { version = "0.21.1", default-features = false, features = ["crypto-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Opus, the codec browsers speak in a call, in pure Rust.
rusty-opus = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Echo cancellation, noise suppression and gain for the microphone: WebRTC's audio processing, in Rust.
sonora = "0.3.0"
toml = "1.2.1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "~3.5.2", default-features = false, features = ["json"] }
webpki-roots = "1.0.12"
# A headset through OpenXR (SteamVR), only with the `vr` feature. From the pull request that
# moves it to Bevy 0.20 (awtterpip/bevy_oxr#212), by revision, until a release has it.
bevy_mod_openxr = { git = "https://github.com/MaximilianHausen/bevy_oxr.git", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d", optional = true }
bevy_mod_xr = { git = "https://github.com/MaximilianHausen/bevy_oxr.git", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d", optional = true }
# OpenXR itself, as the plugin above has it: the controllers' actions are made with its types.
openxr = { version = "0.22.0", optional = true }

# The registry, to open `bingle-3d://` links with this program (`src/link_handler.rs`), and the
# named pipe a link clicked while it runs reaches it by (`src/link_channel.rs`): the pipe, its
# security descriptor, the user's SID, overlapped I/O, and letting that copy come forward.
# Already built for Bevy and others; this asks only for those functions.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Faster incremental builds while developing on Linux: `cargo run --features dev`.
# Not for release builds, and unreliable on Windows.
dev = ["bevy/dynamic_linking"]
# The table in a headset: `cargo run --features vr -- --vr` (docs/plan.md, VR).
vr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]

# Our code lightly optimised and the dependencies fully, so a debug build runs at a usable frame rate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# No debug info for the dependencies: with it, the program's debug file on Windows passes the
# linker's size limit (LNK1318) once the `vr` feature is in. Backtraces still name functions.
debug = false

# CI builds everything cold on small runners and only renders a few frames, so: no debug info (huge
# on Windows) and no optimisation, which roughly halves the first build. Overrides dev's
# dependency opt-level too, which it would otherwise inherit.
[profile.ci]
inherits = "dev"
debug = false
opt-level = 0

[profile.ci.package."*"]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"
